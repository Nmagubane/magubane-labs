# Render Blueprint: New > Blueprint in the Render dashboard, then pick this repo.
# Secrets marked `sync: false` are asked for when you create the service.
services:
  - type: web
    name: magubane-labs
    runtime: node
    region: frankfurt # closest Render region to South Africa
    plan: 0.5c-512mb # smallest paid instance (0.5 CPU, 512 MB); a persistent disk needs a paid instance
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_PATH
        value: /var/data/magubane.db
      - key: TRUST_PROXY
        value: "1"
      - key: SIGNUP_MODE
        value: invite
      - key: INVITE_CODES # comma-separated, e.g. FAMILY-2026,SOWETO-PILOT
        sync: false
      - key: CONTACT_EMAIL # shown on the privacy page for data requests
        sync: false
      - key: ANTHROPIC_API_KEY # optional: type none to deploy without the tutor and add the key later
        sync: false
      - key: TUTOR_MODEL
        value: claude-haiku-5-5 # cheapest; switch to claude-sonnet-5-5 for stronger reasoning
      - key: TUTOR_DAILY_LIMIT # messages per learner per 24 hours
        value: "40"
      - key: TUTOR_GLOBAL_DAILY_LIMIT # messages across the whole site per 24 hours
        value: "600"
      - key: TZ # streaks, "today" and weekly reports run on South African time
        value: Africa/Johannesburg
      - key: EDUCATOR_CODES # comma-separated codes that unlock teacher sign-up, e.g. TEACH-IKUSASA. Keep them private.
        sync: false
      - key: EMAIL_PROVIDER # brevo or resend. Without it, sign-up codes only appear in the server log.
        value: brevo
      - key: EMAIL_API_KEY # from your Brevo or Resend dashboard
        sync: false
      - key: EMAIL_FROM # a sender address you have verified with the provider
        sync: false
      - key: EMAIL_FROM_NAME
        value: Magubane Labs
      - key: REPORT_DAY # weekly guardian/teacher reports: 0 = Sunday
        value: "0"
      - key: REPORT_HOUR # hour of the day, South African time
        value: "17"
